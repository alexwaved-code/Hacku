<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopping agent</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="chat">
      <header class="chat-header">
        <div>
          <h1>Shopping agent</h1>
          <p id="consent" class="consent">Checking consent…</p>
        </div>
        <button type="button" id="revoke">Revoke</button>
      </header>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <footer class="dock">
        <section class="guide" aria-label="How to state a spending decision">
          <p>The mandate allows an official grocer up to $200 a week, or an official ticket platform up to $50 and 2 tickets. Green pays. Yellow asks you. Red blocks.</p>
          <div class="examples">
            <button type="button" data-example="Buy groceries for 80 USD.">Groceries, $80</button>
            <button type="button" data-example="Buy an entertainment ticket for 70 USD.">Entertainment, $70</button>
            <button type="button" data-example="Buy an entertainment ticket from a private account for 40 USD.">Private account</button>
          </div>
        </section>
        <form id="composer" class="composer">
          <label class="sr-only" for="message">Spending decision</label>
          <input
            id="message"
            name="message"
            type="text"
            autocomplete="off"
            placeholder="Category, amount, and fees if you know them"
            required
          />
          <button type="submit">Send</button>
        </form>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
