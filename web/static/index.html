<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hack U Shop</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side side-chats" id="side-chats" data-i18n-attr="aria-label:chats" aria-label="對話">
        <div class="brand-row">
          <a class="brand" href="./" data-i18n-attr="aria-label:title" aria-label="Hack U Shop">
            <img class="logo" src="logo.svg" alt="" width="30" height="30" />
            <span class="brand-text">
              <h1 data-i18n="title">Hack U Shop</h1>
            <span class="brand-sub" data-i18n="brandSub">AI 比價・代購</span>
          </span>
          </a>
          <button type="button" class="icon-btn drawer-close" data-close data-i18n-attr="aria-label:close" aria-label="關閉">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
          </button>
        </div>
        <button type="button" id="new-chat" class="new-chat-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
          </svg>
          <span data-i18n="newChat">新對話</span>
        </button>
        <label class="chat-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
          <input id="chat-search" type="search" placeholder="搜尋對話" autocomplete="off" aria-label="搜尋對話" data-i18n-attr="placeholder:searchChats,aria-label:searchChats" />
        </label>
        <ul id="chat-list" class="chat-list"></ul>
        <nav class="side-links" data-i18n-attr="aria-label:otherPages" aria-label="其他頁面">
          <a href="settings.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
              <circle cx="12" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="2"></circle>
            </svg>
            <span data-i18n="navSettings">設定</span>
          </a>
          <div class="lang-row">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"></circle>
              <path d="M3.5 12h17M12 3.5c2.5 2.6 3.6 5.4 3.6 8.5s-1.1 5.9-3.6 8.5c-2.5-2.6-3.6-5.4-3.6-8.5s1.1-5.9 3.6-8.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
            </svg>
            <span data-i18n="language">語言</span>
            <div class="lang-switch lang-wide" role="group" data-i18n-attr="aria-label:language" aria-label="語言">
              <button type="button" data-lang="zh" aria-pressed="true">中</button>
              <button type="button" data-lang="en" aria-pressed="false">EN</button>
            </div>
          </div>
        </nav>
      </aside>
      <main class="chat">
        <header class="chat-header">
          <div class="header-rail header-lead">
            <button type="button" id="fold-chats" class="rail-btn fold-chats" data-i18n-attr="aria-label:foldChats,title:foldChats" aria-label="收起對話列表" title="收起對話列表">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
            <button type="button" id="open-chats" class="rail-btn menu-btn" data-i18n-attr="aria-label:chatHistory" aria-label="對話紀錄" aria-controls="side-chats">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
            </button>
          </div>
          <div class="chat-heading">
            <h1 id="chat-title">新對話</h1>
          </div>
          <div class="header-rail header-trail">
            <div class="cart-toggle-wrap">
              <button type="button" id="cart-toggle" class="rail-btn cart-mark" data-i18n-attr="aria-label:cart" aria-label="購物車" aria-expanded="true">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6h15l-1.6 9H8L6 6zm0 0L5 3H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                  <circle cx="9" cy="20" r="1.2" fill="currentColor"></circle>
                  <circle cx="18" cy="20" r="1.2" fill="currentColor"></circle>
                </svg>
              </button>
              <span id="cart-toggle-count" class="cart-toggle-count" hidden></span>
            </div>
            <div class="header-actions">
              <div class="lang-switch lang-narrow" role="group" data-i18n-attr="aria-label:language" aria-label="語言">
                <button type="button" data-lang="zh" aria-pressed="true">中</button>
                <button type="button" data-lang="en" aria-pressed="false">EN</button>
              </div>
              <button type="button" id="new-chat-narrow" class="icon-btn" data-i18n-attr="aria-label:newChat,title:newChat" aria-label="新對話" title="新對話">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                </svg>
              </button>
              <a id="cart-link" class="pill cart-link" href="pay.html" data-i18n-attr="aria-label:cart" aria-label="購物車">
                <svg class="cart-link-mark" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6h15l-1.6 9H8L6 6zm0 0L5 3H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                  <circle cx="9" cy="20" r="1.2" fill="currentColor"></circle>
                  <circle cx="18" cy="20" r="1.2" fill="currentColor"></circle>
                </svg>
                <span class="cart-link-label" data-i18n="cart">購物車</span>
                <span id="cart-count" class="cart-link-count"></span>
              </a>
            </div>
          </div>
        </header>
        <div class="feed">
          <ol id="messages" class="messages" aria-live="polite"></ol>
          <button type="button" id="to-latest" class="to-latest" data-i18n-attr="aria-label:toLatest" aria-label="捲到最新" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
        </div>
        <footer class="dock">
          <div id="quick" class="quick"></div>
          <form id="composer" class="composer">
            <label class="sr-only" for="message" data-i18n="message">訊息</label>
            <input id="message" name="message" type="text" autocomplete="off" placeholder="想買什麼，或想問什麼？" />
            <button type="button" id="mic" class="mic" data-i18n-attr="aria-label:mic,title:mic" aria-label="語音輸入" title="語音輸入" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"></rect>
                <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </button>
            <button type="submit" id="send" class="send" data-i18n-attr="aria-label:send,title:sendTitle" aria-label="送出" title="送出（Enter）">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
            <button type="button" id="stop" class="stop" data-i18n-attr="aria-label:stop,title:stopTitle" aria-label="停止" title="停止（Esc）" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"></rect></svg>
            </button>
          </form>
        </footer>
      </main>
      <aside class="side cart-panel" id="side-cart-panel" data-i18n-attr="aria-label:cart" aria-label="購物車">
        <div class="cart-slide">
        <div class="cart-head">
          <h2 data-i18n="cart">購物車</h2>
          <span id="side-count" class="count-badge" hidden></span>
          <button type="button" class="icon-btn drawer-close" data-close data-i18n-attr="aria-label:close" aria-label="關閉">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
          </button>
        </div>
        <a id="side-mandate" class="side-mandate" href="pay.html" hidden></a>
        <div id="side-cart" class="side-cart"></div>
        <div id="side-pay-box" class="side-pay" hidden>
          <div class="sum-row">
            <span id="side-items" class="sum-label"></span>
            <strong id="side-total" class="side-total"></strong>
          </div>
          <div id="cap-meter" class="cap-meter" hidden>
            <div class="cap-bar"><span></span></div>
            <p class="cap-text"></p>
          </div>
          <a id="side-pay" class="checkout-btn" href="pay.html">
            <span data-i18n="checkout">去付款</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
          <p class="pay-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
            <span data-i18n="payNote">Stripe 安全付款，付款前會再確認</span>
          </p>
        </div>
        </div>
      </aside>
    </div>
    <div class="scrim" hidden></div>
    <script src="money.js"></script>
    <script src="cart-store.js"></script>
    <script src="profile-store.js"></script>
    <script src="i18n.js"></script>
    <script src="settings.js"></script>
    <script src="app.js"></script>
  </body>
</html>
