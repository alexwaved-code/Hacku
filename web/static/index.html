<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>購物助理</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side side-chats" id="side-chats" aria-label="對話">
        <div class="brand-row">
          <a class="brand" href="./" aria-label="購物助理">
            <img class="logo" src="logo.svg" alt="" width="30" height="30" />
            <span class="brand-text">
              <h1>購物助理</h1>
              <span class="brand-sub">AI 比價・代購</span>
            </span>
          </a>
          <button type="button" class="icon-btn drawer-close" data-close aria-label="關閉">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
          </button>
        </div>
        <button type="button" id="new-chat" class="new-chat-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
          </svg>
          <span>新對話</span>
        </button>
        <label class="chat-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
          <input id="chat-search" type="search" placeholder="搜尋對話" autocomplete="off" aria-label="搜尋對話" />
        </label>
        <ul id="chat-list" class="chat-list"></ul>
        <nav class="side-links" aria-label="其他頁面">
          <a href="cart.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
              <path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <span>付款授權</span>
          </a>
          <a href="orders.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8l8-4 8 4v8l-8 4-8-4V8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
              <path d="M4 8l8 4 8-4M12 12v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
            </svg>
            <span>代購訂單</span>
          </a>
        </nav>
      </aside>
      <main class="chat">
        <header class="chat-header">
          <button type="button" id="open-chats" class="icon-btn menu-btn" aria-label="對話紀錄" aria-controls="side-chats">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
          </button>
          <a class="brand narrow-title" href="./" aria-label="購物助理">
            <img class="logo" src="logo.svg" alt="" width="26" height="26" />
            <h1>購物助理</h1>
          </a>
          <div class="header-actions">
            <button type="button" id="new-chat-narrow" class="icon-btn" aria-label="新對話" title="新對話">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </button>
            <a id="cart-link" class="pill" href="cart.html">購物車<span id="cart-count"></span></a>
          </div>
        </header>
        <div class="feed">
          <ol id="messages" class="messages" aria-live="polite"></ol>
          <button type="button" id="to-latest" class="to-latest" aria-label="捲到最新" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
        </div>
        <footer class="dock">
          <form id="composer" class="composer">
            <label class="sr-only" for="message">訊息</label>
            <input id="message" name="message" type="text" autocomplete="off" placeholder="想買什麼，或想問什麼？" />
            <button type="submit" id="send" class="send" aria-label="送出" title="送出（Enter）">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
            <button type="button" id="stop" class="stop" aria-label="停止" title="停止（Esc）" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"></rect></svg>
            </button>
          </form>
          <p class="dock-hint">即時上網比價。付款前一定會先讓你確認。</p>
        </footer>
      </main>
      <aside class="side cart-panel" id="side-cart-panel" aria-label="購物車">
        <div class="cart-head">
          <span class="cart-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M6 6h15l-1.6 9H8L6 6zm0 0L5 3H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              <circle cx="9" cy="20" r="1.4" fill="currentColor"></circle>
              <circle cx="18" cy="20" r="1.4" fill="currentColor"></circle>
            </svg>
          </span>
          <h2>購物車</h2>
          <span id="side-count" class="count-badge" hidden></span>
          <button type="button" class="icon-btn drawer-close" data-close aria-label="關閉">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
          </button>
        </div>
        <a id="side-mandate" class="side-mandate" href="cart.html" hidden></a>
        <div id="side-cart" class="side-cart"></div>
        <div id="side-pay-box" class="side-pay" hidden>
          <div class="sum-row">
            <span id="side-items" class="sum-label"></span>
            <strong id="side-total" class="side-total"></strong>
          </div>
          <a id="side-pay" class="checkout-btn" href="cart.html">
            <span>去結帳</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
          <p class="pay-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
            Stripe 安全付款，付款前會再確認
          </p>
        </div>
      </aside>
    </div>
    <div class="scrim" hidden></div>
    <script src="money.js"></script>
    <script src="cart-store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
