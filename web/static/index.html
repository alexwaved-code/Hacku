<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>購物助理</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side side-chats">
        <div class="brand-row">
          <a class="brand" href="./" aria-label="購物助理">
            <img class="logo" src="logo.svg" alt="" width="28" height="28" />
            <h1>購物助理</h1>
          </a>
          <button type="button" id="new-chat" class="icon-btn new-chat" aria-label="新對話" title="新對話">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            </svg>
          </button>
        </div>
        <h2>對話紀錄</h2>
        <ul id="chat-list" class="chat-list"></ul>
        <nav class="side-links" aria-label="其他頁面">
          <a href="cart.html">購物車與付款授權</a>
          <a href="orders.html">代購訂單</a>
        </nav>
      </aside>
      <main class="chat">
        <header class="chat-header">
          <a class="brand narrow-title" href="./" aria-label="購物助理">
            <img class="logo" src="logo.svg" alt="" width="26" height="26" />
            <h1>購物助理</h1>
          </a>
          <div class="header-actions">
            <button type="button" id="new-chat-narrow" class="icon-btn" aria-label="新對話" title="新對話">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </button>
            <a id="cart-link" class="pill" href="cart.html">購物車<span id="cart-count"></span></a>
          </div>
        </header>
        <div class="feed">
          <ol id="messages" class="messages" aria-live="polite"></ol>
          <button type="button" id="to-latest" class="to-latest" aria-label="捲到最新" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
        </div>
        <footer class="dock">
          <form id="composer" class="composer">
            <label class="sr-only" for="message">訊息</label>
            <input id="message" name="message" type="text" autocomplete="off" placeholder="想買什麼，或想問什麼？" />
            <button type="submit" id="send" class="send" aria-label="送出" title="送出（Enter）">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
            <button type="button" id="stop" class="stop" aria-label="停止" title="停止（Esc）" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"></rect></svg>
            </button>
          </form>
          <p class="dock-hint">即時上網比價。付款前一定會先讓你確認。</p>
        </footer>
      </main>
      <aside class="side side-cart">
        <h2 class="cart-mark" aria-label="購物車">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6h15l-1.6 9H8L6 6zm0 0L5 3H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <circle cx="9" cy="20" r="1.4" fill="currentColor"></circle>
            <circle cx="18" cy="20" r="1.4" fill="currentColor"></circle>
          </svg>
        </h2>
        <a id="side-mandate" class="side-mandate" href="cart.html" hidden></a>
        <div id="side-cart" class="side-cart"></div>
        <div class="side-pay">
          <p id="side-total" class="side-total"></p>
          <a id="side-pay" class="pay-icon" href="cart.html" aria-label="去結帳" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect>
              <path d="M3 10h18" fill="none" stroke="currentColor" stroke-width="2"></path>
            </svg>
          </a>
        </div>
      </aside>
    </div>
    <script src="money.js"></script>
    <script src="cart-store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
