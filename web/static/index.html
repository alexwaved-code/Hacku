<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>購物助理</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="chat">
      <header class="chat-header">
        <div>
          <h1>購物助理</h1>
          <p class="sub">上網查真實商品和價錢，也能指定淘寶、Amazon 等商店。說「幫我買」，助理在你的授權上限內準備訂單，你按確認才付款。</p>
        </div>
        <div class="header-actions">
          <button type="button" id="new-chat" class="pill">新對話</button>
          <a id="cart-link" class="pill" href="cart.html">購物車<span id="cart-count"></span></a>
        </div>
      </header>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <footer class="dock">
        <div class="examples" id="examples">
          <button type="button" class="pill" data-prompt="HK$500 以內，通勤用的降噪耳機">降噪耳機 HK$500 內</button>
          <button type="button" class="pill" data-prompt="可以充手提電腦的行動電源">充手提電腦的行動電源</button>
          <button type="button" class="pill" data-prompt="淘寶上的 iPhone 16 手機殼">淘寶手機殼</button>
        </div>
        <form id="composer" class="composer">
          <label class="sr-only" for="message">訊息</label>
          <input id="message" name="message" type="text" autocomplete="off" placeholder="想買什麼，或想問什麼？" />
          <button type="submit" id="send">送出</button>
          <button type="button" id="stop" hidden>停止</button>
        </form>
      </footer>
    </main>
    <script src="money.js"></script>
    <script src="cart-store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
